<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <linearGradient id="bgPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#191a1f"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1d1f25"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="whiteButton" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2f5"/>
    </linearGradient>
    <filter id="drop" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffffff" flood-opacity=".16"/>
    </filter>
    <style>
      .screen { fill: #050506; }
      .board { fill: url(#bgPanel); stroke: #363a46; stroke-width: 1.4; }
      .panel { fill: #111216; stroke: #343845; stroke-width: 1.25; }
      .panel2 { fill: url(#surface); stroke: #3b3f4d; stroke-width: 1.15; }
      .row { fill: #101116; stroke: #2d303b; stroke-width: 1.1; }
      .rowActive { fill: #181a21; stroke: #ffffff; stroke-width: 1.6; }
      .chip { fill: #17191f; stroke: #3a3e4a; stroke-width: 1.1; }
      .chipActive { fill: url(#whiteButton); stroke: #ffffff; stroke-width: 1.1; }
      .mutedBox { fill: #090a0d; stroke: #2a2e39; stroke-width: 1.1; }
      .imageBg { fill: #f7f7f8; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; fill: #f7f8fb; }
      .muted { fill: #9a9daa; }
      .dim { fill: #707581; }
      .dark { fill: #07080a; }
      .title { font-size: 28px; font-weight: 900; }
      .h2 { font-size: 22px; font-weight: 900; }
      .h3 { font-size: 18px; font-weight: 900; }
      .body { font-size: 15px; font-weight: 650; }
      .small { font-size: 13px; font-weight: 650; }
      .tiny { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect class="screen" width="1440" height="920"/>
  <text class="text title" x="56" y="58">卡钳配置抽屉方案</text>
  <text class="text body muted" x="56" y="86">默认不展示配件大图；卡钳列表保持紧凑。用户指向或点击右侧预览标时，再出现临时预览面板。</text>

  <!-- PC -->
  <rect x="54" y="124" width="850" height="712" rx="30" class="board" filter="url(#drop)"/>
  <text class="text h2" x="90" y="172">PC：无图卡片列表 + 右侧悬浮预览 + 下方配置抽屉</text>
  <text class="text small muted" x="90" y="198">适合配件很多时提升浏览效率，减少大图占位；当前选中项展开颜色和刹车盘配置。</text>

  <rect x="90" y="226" width="778" height="72" rx="18" class="mutedBox"/>
  <path d="M121 251 h20 M121 265 h20 M121 279 h20 M126 246 v10 M136 260 v10 M129 274 v10" stroke="#f7f8fb" stroke-width="2.5" stroke-linecap="round"/>
  <text class="text h2" x="160" y="273">3</text>
  <text class="text body muted" x="190" y="272">个配件已选</text>
  <path d="M824 272 l8 -8 l8 8" fill="none" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="90" y="322" width="778" height="478" rx="28" class="panel"/>
  <text class="text h2" x="124" y="370">卡钳</text>
  <text class="text small muted" x="124" y="395">选择配件后，在当前卡片下方展开配置抽屉。</text>
  <circle cx="822" cy="365" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M816 365 l4 4 l8 -10" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="text body muted" x="124" y="440">品牌</text>
  <rect x="178" y="415" width="112" height="50" rx="25" class="chipActive"/>
  <text class="text body dark" x="206" y="447">Brembo</text>
  <rect x="304" y="415" width="132" height="50" rx="25" class="chip"/>
  <text class="text body" x="329" y="447">AP Racing</text>

  <!-- Compact list -->
  <rect x="124" y="492" width="430" height="62" rx="16" class="rowActive"/>
  <circle cx="154" cy="523" r="10" fill="#ef3b34"/>
  <text class="text h3" x="178" y="518">Brembo GT</text>
  <text class="text small muted" x="178" y="539">四活塞 · 街道/赛道 · 当前选择</text>
  <rect x="424" y="507" width="82" height="32" rx="16" class="chip"/>
  <text class="text tiny muted" x="446" y="527">预览</text>
  <circle cx="521" cy="523" r="16" fill="#f5f6f8"/>
  <path d="M512 523 C516 516 526 516 530 523 C526 530 516 530 512 523Z" fill="none" stroke="#07080a" stroke-width="1.8"/>
  <circle cx="521" cy="523" r="3.5" fill="#07080a"/>

  <rect x="124" y="564" width="430" height="58" rx="16" class="row"/>
  <circle cx="154" cy="593" r="10" fill="#2563eb"/>
  <text class="text h3" x="178" y="588">Brembo GT Blue</text>
  <text class="text small muted" x="178" y="609">大六活塞 · 前轮套件</text>
  <circle cx="521" cy="593" r="15" fill="#191b20" stroke="#555b68"/>
  <path d="M513 593 C517 586 525 586 529 593 C525 600 517 600 513 593Z" fill="none" stroke="#d8dae0" stroke-width="1.6"/>
  <circle cx="521" cy="593" r="3.2" fill="#d8dae0"/>

  <rect x="124" y="632" width="430" height="58" rx="16" class="row"/>
  <circle cx="154" cy="661" r="10" fill="#f97316"/>
  <text class="text h3" x="178" y="656">Brembo Racing</text>
  <text class="text small muted" x="178" y="677">赛道款 · 大盘适配</text>
  <circle cx="521" cy="661" r="15" fill="#191b20" stroke="#555b68"/>
  <path d="M513 661 C517 654 525 654 529 661 C525 668 517 668 513 661Z" fill="none" stroke="#d8dae0" stroke-width="1.6"/>
  <circle cx="521" cy="661" r="3.2" fill="#d8dae0"/>

  <!-- Inline drawer -->
  <rect x="124" y="708" width="430" height="58" rx="16" class="panel2"/>
  <text class="text body muted" x="146" y="743">已选配置</text>
  <text class="text small" x="226" y="742">红色 · 加大刹车盘</text>
  <path d="M522 742 l7 7 l7 -7" fill="none" stroke="#9a9daa" stroke-width="2" stroke-linecap="round"/>

  <rect x="580" y="492" width="254" height="274" rx="22" class="panel2" filter="url(#glow)"/>
  <text class="text h3" x="606" y="530">悬浮预览</text>
  <text class="text tiny muted" x="606" y="550">鼠标指向预览标时出现</text>
  <rect x="606" y="570" width="202" height="118" rx="16" class="imageBg"/>
  <circle cx="716" cy="631" r="48" fill="#e4dba0" stroke="#b7ab6b" stroke-width="3"/>
  <circle cx="716" cy="631" r="25" fill="#1c1d20"/>
  <path d="M622 590 C640 570 671 570 687 590 L685 671 C668 692 637 691 621 670 Z" fill="#ef3b34"/>
  <text class="text h3" x="606" y="724">Brembo GT Red</text>
  <text class="text small muted" x="606" y="747">只做预览，不打断当前配置。</text>

  <rect x="580" y="782" width="254" height="0" rx="0" fill="none"/>

  <rect x="124" y="782" width="710" height="0" fill="none"/>

  <rect x="590" y="708" width="244" height="58" rx="16" fill="#ffffff"/>
  <text class="text small dark" x="613" y="742">摘要：Brembo GT · 红色 · 加大盘</text>

  <rect x="124" y="718" width="430" height="0" fill="none"/>
  <rect x="124" y="706" width="430" height="78" rx="18" fill="#111216" stroke="#343845" opacity=".0"/>

  <rect x="124" y="706" width="430" height="82" rx="18" fill="#14161c" stroke="#343845"/>
  <text class="text small muted" x="146" y="733">颜色</text>
  <circle cx="202" cy="728" r="13" fill="#ef3b34" stroke="#ffffff" stroke-width="3"/>
  <circle cx="242" cy="728" r="12" fill="#2563eb"/>
  <circle cx="282" cy="728" r="12" fill="#050506" stroke="#555"/>
  <circle cx="322" cy="728" r="12" fill="#f97316"/>
  <circle cx="362" cy="728" r="12" fill="#f2c230"/>
  <circle cx="402" cy="728" r="12" fill="#16a34a"/>
  <rect x="438" y="711" width="82" height="34" rx="17" class="chip"/>
  <text class="text tiny" x="463" y="732">调色</text>
  <text class="text small muted" x="146" y="769">刹车盘</text>
  <rect x="208" y="750" width="62" height="30" rx="12" class="chip"/>
  <text class="text tiny" x="227" y="769">不变</text>
  <rect x="280" y="750" width="90" height="30" rx="12" class="chipActive"/>
  <text class="text tiny dark" x="301" y="769">加大盘</text>
  <rect x="380" y="750" width="110" height="30" rx="12" class="chip"/>
  <text class="text tiny" x="405" y="769">碳陶瓷</text>

  <!-- Mobile -->
  <rect x="948" y="124" width="438" height="712" rx="32" class="board" filter="url(#drop)"/>
  <text class="text h2" x="986" y="172">移动端：列表抽屉 + 点按预览</text>
  <text class="text small muted" x="986" y="198">不默认露图。点小眼睛打开轻量预览层，配置仍留在选中项下方。</text>

  <rect x="986" y="226" width="360" height="72" rx="18" class="mutedBox"/>
  <path d="M1017 251 h18 M1017 265 h18 M1017 279 h18 M1022 246 v10 M1032 260 v10 M1025 274 v10" stroke="#f7f8fb" stroke-width="2.4" stroke-linecap="round"/>
  <text class="text h2" x="1054" y="273">3</text>
  <text class="text small muted" x="1084" y="272">个配件已选</text>
  <path d="M1304 272 l8 -8 l8 8" fill="none" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="986" y="324" width="360" height="474" rx="28" class="panel"/>
  <text class="text h2" x="1024" y="372">卡钳</text>
  <text class="text small muted" x="1024" y="397">Brembo GT Red</text>
  <circle cx="1309" cy="367" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M1303 367 l4 4 l8 -10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="text small muted" x="1024" y="438">品牌</text>
  <rect x="1075" y="414" width="96" height="44" rx="22" class="chipActive"/>
  <text class="text small dark" x="1100" y="442">Brembo</text>
  <rect x="1183" y="414" width="112" height="44" rx="22" class="chip"/>
  <text class="text small" x="1204" y="442">AP Racing</text>

  <rect x="1024" y="482" width="286" height="54" rx="16" class="rowActive"/>
  <circle cx="1050" cy="509" r="9" fill="#ef3b34"/>
  <text class="text h3" x="1072" y="505">Brembo GT</text>
  <text class="text tiny muted" x="1072" y="522">当前选择</text>
  <circle cx="1284" cy="509" r="15" fill="#f6f7f9"/>
  <path d="M1276 509 C1280 502 1288 502 1292 509 C1288 516 1280 516 1276 509Z" fill="none" stroke="#07080a" stroke-width="1.6"/>
  <circle cx="1284" cy="509" r="3" fill="#07080a"/>

  <rect x="1024" y="546" width="286" height="46" rx="15" class="row"/>
  <circle cx="1050" cy="569" r="8" fill="#2563eb"/>
  <text class="text small" x="1072" y="574">Brembo GT Blue</text>
  <circle cx="1284" cy="569" r="14" fill="#191b20" stroke="#555b68"/>
  <path d="M1277 569 C1281 563 1287 563 1291 569 C1287 575 1281 575 1277 569Z" fill="none" stroke="#d8dae0" stroke-width="1.4"/>

  <rect x="1024" y="604" width="286" height="132" rx="18" fill="#14161c" stroke="#343845"/>
  <text class="text h3" x="1044" y="636">配置抽屉</text>
  <text class="text tiny muted" x="1130" y="636">跟随选中卡钳展开</text>
  <text class="text small muted" x="1044" y="671">颜色</text>
  <circle cx="1098" cy="666" r="13" fill="#ef3b34" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1138" cy="666" r="12" fill="#2563eb"/>
  <circle cx="1178" cy="666" r="12" fill="#050506" stroke="#555"/>
  <circle cx="1218" cy="666" r="12" fill="#f97316"/>
  <circle cx="1258" cy="666" r="12" fill="#f2c230"/>
  <rect x="1044" y="694" width="58" height="30" rx="12" class="chip"/>
  <text class="text tiny" x="1063" y="713">不变</text>
  <rect x="1112" y="694" width="78" height="30" rx="12" class="chipActive"/>
  <text class="text tiny dark" x="1130" y="713">加大盘</text>
  <rect x="1200" y="694" width="86" height="30" rx="12" class="chip"/>
  <text class="text tiny" x="1220" y="713">碳陶瓷</text>

  <rect x="1038" y="748" width="258" height="116" rx="22" class="panel2" filter="url(#glow)"/>
  <text class="text h3" x="1060" y="780">预览层</text>
  <text class="text tiny muted" x="1060" y="800">点击眼睛后出现，可点空白关闭</text>
  <rect x="1060" y="816" width="92" height="52" rx="12" class="imageBg"/>
  <circle cx="1114" cy="844" r="22" fill="#e4dba0" stroke="#b7ab6b" stroke-width="2"/>
  <circle cx="1114" cy="844" r="9" fill="#1c1d20"/>
  <path d="M1066 829 C1076 819 1090 819 1098 830 L1097 860 C1088 870 1072 869 1065 859 Z" fill="#ef3b34"/>
  <text class="text small" x="1170" y="836">Brembo GT Red</text>
  <text class="text tiny muted" x="1170" y="858">仅预览，不占默认空间</text>
</svg>
