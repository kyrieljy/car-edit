<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680">
  <defs>
    <linearGradient id="phoneBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset=".45" stop-color="#090a0d"/>
      <stop offset="1" stop-color="#120d06"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#67ffca" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#67ffca" stop-opacity=".04"/>
      <stop offset="1" stop-color="#67ffca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#13161b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="raised" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#20242b"/>
      <stop offset="1" stop-color="#151820"/>
    </linearGradient>
    <linearGradient id="activeGreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58eebf"/>
      <stop offset="1" stop-color="#28b989"/>
    </linearGradient>
    <linearGradient id="wheelLip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cfd4dd"/>
      <stop offset="1" stop-color="#6d7480"/>
    </linearGradient>
    <filter id="phoneShadow" x="-12%" y="-8%" width="124%" height="116%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000000" flood-opacity=".56"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#67ffca" flood-opacity=".36"/>
    </filter>
    <style>
      .bg { fill: #050506; }
      .phone { fill: url(#phoneBg); stroke: #303642; stroke-width: 2; }
      .aura { fill: url(#aura); }
      .panel { fill: url(#panel); stroke: #343a46; stroke-width: 1.4; }
      .raised { fill: url(#raised); stroke: #343a46; stroke-width: 1.2; }
      .row { fill: #101217; stroke: #2d3340; stroke-width: 1.2; }
      .rowActive { fill: #151820; stroke: #f7f8fb; stroke-width: 2; }
      .content { fill: #111317; stroke: #343a46; stroke-width: 1.2; }
      .chip { fill: #191d24; stroke: #3b424f; stroke-width: 1.2; }
      .chipActive { fill: url(#activeGreen); stroke: #78ffd2; stroke-width: 1.2; }
      .whiteChip { fill: #ffffff; stroke: #ffffff; stroke-width: 1.2; }
      .preview { fill: #f7f8fb; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; fill: #f7f8fb; }
      .muted { fill: #9aa3b2; }
      .dim { fill: #737b89; }
      .activeText { fill: #caffed; }
      .dark { fill: #07080a; }
      .h1 { font-size: 38px; font-weight: 950; }
      .h2 { font-size: 30px; font-weight: 950; }
      .h3 { font-size: 24px; font-weight: 900; }
      .body { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 650; }
      .tiny { font-size: 12px; font-weight: 800; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1680"/>
  <text class="text h1" x="74" y="82">移动端 Accordion 配件选择</text>
  <text class="text body muted" x="74" y="118">参考 21st.dev 源码：单选展开、trigger 点击、chevron 旋转、content 高度动画；颜色保持当前移动端系统风格。</text>

  <!-- Phone frame -->
  <rect x="236" y="164" width="608" height="1370" rx="54" class="phone" filter="url(#phoneShadow)"/>
  <rect x="238" y="166" width="604" height="390" rx="54" class="aura"/>

  <!-- Status/head -->
  <text class="text tiny" x="286" y="232">12:51</text>
  <rect x="720" y="218" width="54" height="18" rx="9" fill="#f7f8fb" opacity=".92"/>
  <rect x="780" y="218" width="22" height="18" rx="5" fill="#f7f8fb" opacity=".92"/>
  <text class="text h2" x="286" y="294">配件</text>
  <text class="text small muted" x="286" y="322">单个分类内完成配件、颜色和样式选择</text>

  <!-- Summary trigger -->
  <rect x="286" y="360" width="508" height="78" rx="20" fill="#060708" stroke="#3b4352" stroke-width="1.5"/>
  <path d="M322 386 h22 M322 404 h22 M322 422 h22 M328 380 v12 M338 398 v12 M330 416 v12" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round"/>
  <text class="text h2" x="368" y="412">3</text>
  <text class="text body muted" x="406" y="410">个配件已选</text>
  <path d="M748 412 l12 -12 l12 12" fill="none" stroke="#f7f8fb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main accordion panel -->
  <rect x="286" y="474" width="508" height="872" rx="32" class="panel"/>
  <text class="text h2" x="326" y="530">轮毂</text>
  <text class="text small muted" x="326" y="558">当前：BBS LM-R · 银色 · 标准</text>
  <circle cx="756" cy="528" r="16" fill="none" stroke="#f7f8fb" stroke-width="3"/>
  <path d="M748 528 l6 6 l12 -16" fill="none" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand chips -->
  <text class="text small muted" x="326" y="612">品牌</text>
  <rect x="386" y="584" width="104" height="52" rx="26" class="whiteChip"/>
  <text class="text body dark" x="417" y="618">BBS</text>
  <rect x="504" y="584" width="116" height="52" rx="26" class="chip"/>
  <text class="text body" x="536" y="618">RAYS</text>
  <rect x="634" y="584" width="104" height="52" rx="26" class="chip"/>
  <text class="text body" x="666" y="618">HRE</text>

  <!-- Active accordion row -->
  <rect x="326" y="666" width="428" height="74" rx="20" class="rowActive"/>
  <text class="text h3" x="350" y="704">BBS LM-R DS-BKBD</text>
  <text class="text tiny muted" x="350" y="724">当前展开 · 单选 accordion item</text>
  <path d="M716 714 l10 -10 l10 10" fill="none" stroke="#f7f8fb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accordion content -->
  <rect x="326" y="754" width="428" height="398" rx="20" class="content"/>

  <!-- Preview first on mobile, following source grid stacking -->
  <rect x="350" y="778" width="380" height="158" rx="18" class="preview"/>
  <circle cx="540" cy="858" r="58" fill="#111317"/>
  <circle cx="540" cy="858" r="49" fill="url(#wheelLip)"/>
  <circle cx="540" cy="858" r="38" fill="#24262b"/>
  <circle cx="540" cy="858" r="15" fill="#090a0c"/>
  <circle cx="540" cy="858" r="6" fill="#cfd4dd"/>
  <g fill="#eef2f7">
    <path d="M540 810 L548 842 L532 842 Z"/>
    <path d="M588 858 L556 866 L556 850 Z"/>
    <path d="M540 906 L532 874 L548 874 Z"/>
    <path d="M492 858 L524 850 L524 866 Z"/>
    <path d="M574 824 L552 852 L542 842 Z"/>
    <path d="M574 892 L542 874 L552 864 Z"/>
    <path d="M506 892 L528 864 L538 874 Z"/>
    <path d="M506 824 L538 842 L528 852 Z"/>
  </g>
  <text class="text h3 dark" x="374" y="820">预览图</text>
  <text class="text tiny" x="374" y="842" fill="#69717e">展开后随 content 下滑淡入</text>

  <!-- Color -->
  <text class="text h3" x="350" y="982">颜色</text>
  <text class="text tiny muted" x="680" y="982">横滑</text>
  <rect x="350" y="1000" width="82" height="52" rx="26" class="chipActive" filter="url(#greenGlow)"/>
  <circle cx="376" cy="1026" r="12" fill="#cfd4dd" stroke="#87909c" stroke-width="2"/>
  <text class="text small activeText" x="398" y="1032">银</text>
  <rect x="444" y="1000" width="52" height="52" rx="26" class="chip"/>
  <circle cx="470" cy="1026" r="12" fill="#050506" stroke="#555"/>
  <rect x="508" y="1000" width="52" height="52" rx="26" class="chip"/>
  <circle cx="534" cy="1026" r="12" fill="#737984"/>
  <rect x="572" y="1000" width="52" height="52" rx="26" class="chip"/>
  <circle cx="598" cy="1026" r="12" fill="#d4af37"/>
  <rect x="636" y="1000" width="72" height="52" rx="26" class="chip"/>
  <text class="text tiny" x="660" y="1031">调色</text>

  <!-- Style -->
  <text class="text h3" x="350" y="1094">样式</text>
  <rect x="416" y="1068" width="80" height="46" rx="16" class="chipActive"/>
  <text class="text small activeText" x="444" y="1097">标准</text>
  <rect x="508" y="1068" width="80" height="46" rx="16" class="chip"/>
  <text class="text small" x="536" y="1097">深凹</text>
  <rect x="600" y="1068" width="100" height="46" rx="16" class="chip"/>
  <text class="text small" x="626" y="1097">多片式</text>

  <rect x="350" y="1176" width="380" height="54" rx="18" fill="#ffffff"/>
  <text class="text body dark" x="386" y="1211">确认：BBS LM-R · 银色 · 标准</text>

  <!-- Collapsed items -->
  <rect x="326" y="1256" width="428" height="66" rx="18" class="row"/>
  <text class="text h3" x="350" y="1296">RAYS TE37 SL</text>
  <path d="M716 1298 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="326" y="1336" width="428" height="66" rx="18" class="row"/>
  <text class="text h3" x="350" y="1376">HRE FF11 FlowForm</text>
  <path d="M716 1378 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>
  <rect x="326" y="1416" width="428" height="66" rx="18" class="row"/>
  <text class="text h3" x="350" y="1456">Rotiform RSE</text>
  <path d="M716 1458 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion notes -->
  <rect x="74" y="1360" width="372" height="236" rx="24" fill="#101217" stroke="#343a46"/>
  <text class="text h3" x="104" y="1406">动画逻辑</text>
  <text class="text small muted" x="104" y="1442">1. Trigger 点击：单选展开</text>
  <text class="text small muted" x="104" y="1474">2. Chevron：0° → 180°</text>
  <text class="text small muted" x="104" y="1506">3. Content：height 0 → auto</text>
  <text class="text small muted" x="104" y="1538">4. 预览图：opacity 0 → 1，Y +8 → 0</text>
  <text class="text small muted" x="104" y="1570">5. 色卡/样式：轻微按压 scale 0.98</text>

  <rect x="636" y="1360" width="370" height="236" rx="24" fill="#101217" stroke="#343a46"/>
  <text class="text h3" x="666" y="1406">源码映射</text>
  <text class="text small muted" x="666" y="1442">Accordion type=&quot;single&quot;</text>
  <text class="text small muted" x="666" y="1474">AccordionTrigger：配件名称行</text>
  <text class="text small muted" x="666" y="1506">AccordionContent：预览 + 配置控件</text>
  <text class="text small muted" x="666" y="1538">img：移动端在内容上方/下方堆叠</text>
  <text class="text small muted" x="666" y="1570">selected state：沿用绿色高亮体系</text>
</svg>
