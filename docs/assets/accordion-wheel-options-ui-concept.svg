<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f2f3f5"/>
    </linearGradient>
    <linearGradient id="previewBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f7f8"/>
      <stop offset=".52" stop-color="#e9eaee"/>
      <stop offset="1" stop-color="#d7d9df"/>
    </linearGradient>
    <linearGradient id="wheelLip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cfd4dd"/>
      <stop offset="1" stop-color="#6d7480"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity=".14"/>
    </filter>
    <filter id="buttonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <style>
      .page { fill: url(#page); }
      .shell { fill: #fff; stroke: #dadde3; stroke-width: 1.5; }
      .line { stroke: #e0e2e7; stroke-width: 1.2; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; fill: #08090b; }
      .muted { fill: #646975; }
      .soft { fill: #8b909b; }
      .h1 { font-size: 34px; font-weight: 950; }
      .h2 { font-size: 28px; font-weight: 950; }
      .h3 { font-size: 22px; font-weight: 900; }
      .body { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; font-weight: 650; }
      .tiny { font-size: 12px; font-weight: 800; }
      .chip { fill: #fff; stroke: #d8dbe2; stroke-width: 1.2; }
      .chipActive { fill: #0f1012; stroke: #0f1012; stroke-width: 1.2; }
      .chipText { fill: #0f1012; }
      .chipTextActive { fill: #fff; }
      .preview { fill: url(#previewBg); stroke: #d8dbe2; stroke-width: 1.2; }
      .blackPanel { fill: #111214; }
    </style>
  </defs>

  <rect class="page" width="1440" height="920"/>
  <text class="text h1" x="78" y="82">Accordion 配件配置设计稿</text>
  <text class="text body muted" x="78" y="116">基于 21st.dev accordion-03：展开项保持左右两栏，左侧从介绍文案改成“配件名称 + 颜色 + 样式”，右侧作为预览图。</text>

  <rect x="78" y="162" width="1284" height="684" rx="2" class="shell" filter="url(#softShadow)"/>

  <!-- Active accordion item -->
  <rect x="78" y="162" width="1284" height="358" fill="#fff"/>
  <line x1="78" y1="520" x2="1362" y2="520" class="line"/>
  <line x1="718" y1="162" x2="718" y2="520" class="line"/>

  <!-- Left active content -->
  <text class="text h2" x="122" y="225">BBS LM-R DS-BKBD</text>
  <text class="text small muted" x="122" y="253">轮毂配件名称 · 当前选中</text>
  <text class="text body muted" x="122" y="298">选择轮毂后，在展开区域内直接选择颜色和样式；生成前摘要会同步更新。</text>

  <text class="text h3" x="122" y="355">颜色</text>
  <g>
    <rect x="122" y="378" width="92" height="46" rx="14" class="chipActive"/>
    <circle cx="148" cy="401" r="11" fill="#cfd4dd" stroke="#87909c" stroke-width="2"/>
    <text class="text small chipTextActive" x="170" y="407">银色</text>

    <rect x="226" y="378" width="92" height="46" rx="14" class="chip"/>
    <circle cx="252" cy="401" r="11" fill="#050506" stroke="#555" stroke-width="1.5"/>
    <text class="text small chipText" x="274" y="407">黑色</text>

    <rect x="330" y="378" width="104" height="46" rx="14" class="chip"/>
    <circle cx="356" cy="401" r="11" fill="#737984"/>
    <text class="text small chipText" x="378" y="407">枪灰</text>

    <rect x="446" y="378" width="92" height="46" rx="14" class="chip"/>
    <circle cx="472" cy="401" r="11" fill="#d4af37"/>
    <text class="text small chipText" x="494" y="407">金色</text>

    <rect x="550" y="378" width="104" height="46" rx="14" class="chip"/>
    <text class="text small chipText" x="582" y="407">调色盘</text>
  </g>

  <text class="text h3" x="122" y="471">样式</text>
  <g>
    <rect x="194" y="444" width="94" height="46" rx="14" class="chipActive"/>
    <text class="text small chipTextActive" x="224" y="473">标准</text>

    <rect x="300" y="444" width="94" height="46" rx="14" class="chip"/>
    <text class="text small chipText" x="330" y="473">深凹</text>

    <rect x="406" y="444" width="110" height="46" rx="14" class="chip"/>
    <text class="text small chipText" x="438" y="473">多片式</text>

    <rect x="528" y="444" width="96" height="46" rx="14" class="chip"/>
    <text class="text small chipText" x="558" y="473">竞技</text>
  </g>

  <rect x="122" y="318" width="524" height="0" fill="none"/>
  <rect x="122" y="494" width="530" height="0" fill="none"/>

  <!-- Right preview -->
  <rect x="746" y="192" width="586" height="298" rx="20" class="preview"/>
  <rect x="776" y="222" width="526" height="238" rx="18" fill="#fff" opacity=".72"/>
  <circle cx="1039" cy="341" r="106" fill="#101113"/>
  <circle cx="1039" cy="341" r="91" fill="url(#wheelLip)"/>
  <circle cx="1039" cy="341" r="73" fill="#24262b"/>
  <circle cx="1039" cy="341" r="31" fill="#08090b"/>
  <circle cx="1039" cy="341" r="12" fill="#cfd4dd"/>
  <g fill="#e9edf3">
    <path d="M1039 260 L1050 315 L1028 315 Z"/>
    <path d="M1120 341 L1065 352 L1065 330 Z"/>
    <path d="M1039 422 L1028 367 L1050 367 Z"/>
    <path d="M958 341 L1013 330 L1013 352 Z"/>
    <path d="M1096 284 L1064 329 L1049 314 Z"/>
    <path d="M1096 398 L1049 368 L1064 353 Z"/>
    <path d="M982 398 L1014 353 L1029 368 Z"/>
    <path d="M982 284 L1029 314 L1014 329 Z"/>
  </g>
  <g fill="#111214">
    <circle cx="1039" cy="282" r="4"/>
    <circle cx="1098" cy="341" r="4"/>
    <circle cx="1039" cy="400" r="4"/>
    <circle cx="980" cy="341" r="4"/>
    <circle cx="1081" cy="299" r="4"/>
    <circle cx="1081" cy="383" r="4"/>
    <circle cx="997" cy="383" r="4"/>
    <circle cx="997" cy="299" r="4"/>
  </g>
  <text class="text h3" x="776" y="260">预览图</text>
  <text class="text small muted" x="776" y="286">右侧固定展示当前展开配件</text>

  <rect x="778" y="430" width="248" height="42" rx="12" class="blackPanel"/>
  <text class="text small" x="800" y="457" fill="#fff">BBS LM-R · 银色 · 标准</text>

  <!-- Collapsed rows -->
  <g>
    <line x1="78" y1="610" x2="1362" y2="610" class="line"/>
    <line x1="78" y1="700" x2="1362" y2="700" class="line"/>
    <line x1="78" y1="790" x2="1362" y2="790" class="line"/>
    <text class="text h2" x="122" y="575">RAYS TE37 SL</text>
    <text class="text small muted" x="438" y="575">6 辐 · 轻量竞技 · 可选枪灰/白色/青铜</text>
    <path d="M1312 570 l9 9 l9 -9" fill="none" stroke="#111214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="text h2" x="122" y="665">HRE FF11 FlowForm</text>
    <text class="text small muted" x="520" y="665">多辐 · 日常性能 · 可选银色/黑色</text>
    <path d="M1312 660 l9 9 l9 -9" fill="none" stroke="#111214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="text h2" x="122" y="755">Rotiform RSE</text>
    <text class="text small muted" x="430" y="755">复古多片 · 可选深凹样式</text>
    <path d="M1312 750 l9 9 l9 -9" fill="none" stroke="#111214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="text h2" x="122" y="824">OEM+ Performance</text>
    <text class="text small muted" x="514" y="824">低调原厂升级风格</text>
    <path d="M1312 820 l9 9 l9 -9" fill="none" stroke="#111214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Notes -->
  <rect x="78" y="862" width="1284" height="0" fill="none"/>
  <text class="text tiny soft" x="78" y="888">交互建议：Accordion 仍为 single 模式；展开项左侧内容由原“content + View More”替换为颜色/样式控件，右侧 img 替换为当前配件预览图。</text>
</svg>
