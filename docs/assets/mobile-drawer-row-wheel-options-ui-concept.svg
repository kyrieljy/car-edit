<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1680" viewBox="0 0 1080 1680">
  <defs>
    <linearGradient id="phoneBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset=".48" stop-color="#090a0d"/>
      <stop offset="1" stop-color="#120d06"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#67ffca" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#67ffca" stop-opacity=".04"/>
      <stop offset="1" stop-color="#67ffca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#13161b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="row" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#181b22"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="activeGreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58eebf"/>
      <stop offset="1" stop-color="#28b989"/>
    </linearGradient>
    <linearGradient id="wheelLip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cfd4dd"/>
      <stop offset="1" stop-color="#6d7480"/>
    </linearGradient>
    <filter id="phoneShadow" x="-12%" y="-8%" width="124%" height="116%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000000" flood-opacity=".56"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#67ffca" flood-opacity=".32"/>
    </filter>
    <style>
      .bg { fill: #050506; }
      .phone { fill: url(#phoneBg); stroke: #303642; stroke-width: 2; }
      .aura { fill: url(#aura); }
      .panel { fill: url(#panel); stroke: #343a46; stroke-width: 1.4; }
      .row { fill: url(#row); stroke: #2d3340; stroke-width: 1.2; }
      .rowActive { fill: #151820; stroke: #f7f8fb; stroke-width: 2; }
      .content { fill: #111317; stroke: #343a46; stroke-width: 1.2; }
      .thumb { fill: #f7f8fb; }
      .chip { fill: #191d24; stroke: #3b424f; stroke-width: 1.2; }
      .chipActive { fill: url(#activeGreen); stroke: #78ffd2; stroke-width: 1.2; }
      .whiteChip { fill: #ffffff; stroke: #ffffff; stroke-width: 1.2; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; fill: #f7f8fb; }
      .muted { fill: #9aa3b2; }
      .activeText { fill: #caffed; }
      .dark { fill: #07080a; }
      .h1 { font-size: 38px; font-weight: 950; }
      .h2 { font-size: 30px; font-weight: 950; }
      .h3 { font-size: 23px; font-weight: 900; }
      .body { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 650; }
      .tiny { font-size: 12px; font-weight: 800; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1680"/>
  <text class="text h1" x="74" y="82">移动端列表抽屉方案</text>
  <text class="text body muted" x="74" y="118">每个配件行左侧放参考小图；展开后只显示颜色和样式配置，不再展示大预览图。</text>

  <rect x="236" y="164" width="608" height="1370" rx="54" class="phone" filter="url(#phoneShadow)"/>
  <rect x="238" y="166" width="604" height="360" rx="54" class="aura"/>

  <text class="text tiny" x="286" y="232">12:51</text>
  <rect x="720" y="218" width="54" height="18" rx="9" fill="#f7f8fb" opacity=".92"/>
  <rect x="780" y="218" width="22" height="18" rx="5" fill="#f7f8fb" opacity=".92"/>
  <text class="text h2" x="286" y="294">配件</text>
  <text class="text small muted" x="286" y="322">轮毂 · 列表抽屉</text>

  <rect x="286" y="360" width="508" height="78" rx="20" fill="#060708" stroke="#3b4352" stroke-width="1.5"/>
  <path d="M322 386 h22 M322 404 h22 M322 422 h22 M328 380 v12 M338 398 v12 M330 416 v12" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round"/>
  <text class="text h2" x="368" y="412">3</text>
  <text class="text body muted" x="406" y="410">个配件已选</text>
  <path d="M748 412 l12 -12 l12 12" fill="none" stroke="#f7f8fb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="286" y="474" width="508" height="872" rx="32" class="panel"/>
  <text class="text h2" x="326" y="530">轮毂</text>
  <text class="text small muted" x="326" y="558">当前：BBS LM-R · 银色 · 标准</text>
  <circle cx="756" cy="528" r="16" fill="none" stroke="#f7f8fb" stroke-width="3"/>
  <path d="M748 528 l6 6 l12 -16" fill="none" stroke="#f7f8fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="text small muted" x="326" y="612">品牌</text>
  <rect x="386" y="584" width="104" height="52" rx="26" class="whiteChip"/>
  <text class="text body dark" x="417" y="618">BBS</text>
  <rect x="504" y="584" width="116" height="52" rx="26" class="chip"/>
  <text class="text body" x="536" y="618">RAYS</text>
  <rect x="634" y="584" width="104" height="52" rx="26" class="chip"/>
  <text class="text body" x="666" y="618">HRE</text>

  <!-- Active row with thumbnail -->
  <rect x="326" y="666" width="428" height="92" rx="22" class="rowActive"/>
  <rect x="346" y="686" width="58" height="58" rx="14" class="thumb"/>
  <circle cx="375" cy="715" r="23" fill="#111317"/>
  <circle cx="375" cy="715" r="19" fill="url(#wheelLip)"/>
  <circle cx="375" cy="715" r="13" fill="#24262b"/>
  <circle cx="375" cy="715" r="5" fill="#090a0c"/>
  <path d="M375 697 L381 710 L369 710 Z M393 715 L380 721 L380 709 Z M375 733 L369 720 L381 720 Z M357 715 L370 709 L370 721 Z" fill="#eef2f7"/>
  <text class="text h3" x="424" y="709">BBS LM-R DS-BKBD</text>
  <text class="text small muted" x="424" y="733">银色 · 标准 · 当前展开</text>
  <path d="M716 720 l10 -10 l10 10" fill="none" stroke="#f7f8fb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Drawer content: no large preview -->
  <rect x="326" y="776" width="428" height="284" rx="22" class="content"/>
  <text class="text h3" x="350" y="824">颜色</text>
  <text class="text tiny muted" x="680" y="824">横滑</text>
  <rect x="350" y="844" width="82" height="52" rx="26" class="chipActive" filter="url(#greenGlow)"/>
  <circle cx="376" cy="870" r="12" fill="#cfd4dd" stroke="#87909c" stroke-width="2"/>
  <text class="text small activeText" x="398" y="876">银</text>
  <rect x="444" y="844" width="52" height="52" rx="26" class="chip"/>
  <circle cx="470" cy="870" r="12" fill="#050506" stroke="#555"/>
  <rect x="508" y="844" width="52" height="52" rx="26" class="chip"/>
  <circle cx="534" cy="870" r="12" fill="#737984"/>
  <rect x="572" y="844" width="52" height="52" rx="26" class="chip"/>
  <circle cx="598" cy="870" r="12" fill="#d4af37"/>
  <rect x="636" y="844" width="72" height="52" rx="26" class="chip"/>
  <text class="text tiny" x="660" y="875">调色</text>

  <text class="text h3" x="350" y="950">样式</text>
  <rect x="416" y="924" width="80" height="46" rx="16" class="chipActive"/>
  <text class="text small activeText" x="444" y="953">标准</text>
  <rect x="508" y="924" width="80" height="46" rx="16" class="chip"/>
  <text class="text small" x="536" y="953">深凹</text>
  <rect x="600" y="924" width="100" height="46" rx="16" class="chip"/>
  <text class="text small" x="626" y="953">多片式</text>

  <rect x="350" y="994" width="380" height="46" rx="16" fill="#ffffff"/>
  <text class="text body dark" x="386" y="1024">确认：BBS LM-R · 银色 · 标准</text>

  <!-- Collapsed rows with thumbnails -->
  <rect x="326" y="1082" width="428" height="86" rx="20" class="row"/>
  <rect x="346" y="1100" width="50" height="50" rx="13" class="thumb"/>
  <circle cx="371" cy="1125" r="20" fill="#111317"/>
  <circle cx="371" cy="1125" r="16" fill="#737984"/>
  <text class="text h3" x="416" y="1118">RAYS TE37 SL</text>
  <text class="text small muted" x="416" y="1142">枪灰 · 竞技 · 可展开</text>
  <path d="M716 1130 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>

  <rect x="326" y="1188" width="428" height="86" rx="20" class="row"/>
  <rect x="346" y="1206" width="50" height="50" rx="13" class="thumb"/>
  <circle cx="371" cy="1231" r="20" fill="#111317"/>
  <circle cx="371" cy="1231" r="16" fill="#d4af37"/>
  <text class="text h3" x="416" y="1224">HRE FF11 FlowForm</text>
  <text class="text small muted" x="416" y="1248">金色 · 多辐 · 可展开</text>
  <path d="M716 1236 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>

  <rect x="326" y="1294" width="428" height="86" rx="20" class="row"/>
  <rect x="346" y="1312" width="50" height="50" rx="13" class="thumb"/>
  <circle cx="371" cy="1337" r="20" fill="#111317"/>
  <circle cx="371" cy="1337" r="16" fill="#cfd4dd"/>
  <text class="text h3" x="416" y="1330">Rotiform RSE</text>
  <text class="text small muted" x="416" y="1354">银色 · 深凹 · 可展开</text>
  <path d="M716 1342 l10 10 l10 -10" fill="none" stroke="#9aa3b2" stroke-width="3" stroke-linecap="round"/>

  <!-- notes -->
  <rect x="74" y="1424" width="932" height="154" rx="24" fill="#101217" stroke="#343a46"/>
  <text class="text h3" x="106" y="1470">交互说明</text>
  <text class="text small muted" x="106" y="1506">1. 栏目行左侧固定参考小图，减少展开后占用高度。</text>
  <text class="text small muted" x="106" y="1538">2. 展开内容只包含颜色、样式、确认摘要，不再显示预览图。</text>
  <text class="text small muted" x="106" y="1570">3. AccordionContent 仍做 height 0 → auto，chevron 旋转；选中态沿用绿色体系。</text>
</svg>
