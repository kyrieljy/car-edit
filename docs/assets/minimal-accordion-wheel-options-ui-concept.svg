<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset=".52" stop-color="#090a0d"/>
      <stop offset="1" stop-color="#120d06"/>
    </linearGradient>
    <linearGradient id="activeGreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58eebf"/>
      <stop offset="1" stop-color="#28b989"/>
    </linearGradient>
    <linearGradient id="wheelLip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#cfd4dd"/>
      <stop offset="1" stop-color="#6d7480"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#67ffca" stop-opacity=".14"/>
      <stop offset=".52" stop-color="#67ffca" stop-opacity=".03"/>
      <stop offset="1" stop-color="#67ffca" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-8%" width="120%" height="116%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <style>
      .page { fill: #030304; }
      .panel { fill: url(#bg); stroke: #2c3340; stroke-width: 1.4; }
      .aura { fill: url(#aura); }
      .line { stroke: rgba(255,255,255,.12); stroke-width: 1; }
      .softLine { stroke: rgba(255,255,255,.07); stroke-width: 1; }
      .chip { fill: rgba(255,255,255,.055); stroke: rgba(255,255,255,.18); stroke-width: 1; }
      .chipActive { fill: url(#activeGreen); stroke: #78ffd2; stroke-width: 1; }
      .thumb { fill: #f8fafc; }
      .confirm { fill: #ffffff; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", "Inter", Arial, sans-serif; fill: #f7f8fb; }
      .muted { fill: #9aa3b2; }
      .activeText { fill: #d8fff2; }
      .darkText { fill: #07080a; }
      .h1 { font-size: 34px; font-weight: 950; }
      .h2 { font-size: 27px; font-weight: 950; }
      .h3 { font-size: 22px; font-weight: 900; }
      .body { font-size: 16px; font-weight: 720; }
      .small { font-size: 13px; font-weight: 650; }
      .tiny { font-size: 11px; font-weight: 750; }
    </style>
  </defs>

  <rect class="page" width="1440" height="1120"/>
  <text class="text h1" x="54" y="58">无卡片化 Accordion 方案</text>
  <text class="text body muted" x="54" y="88">外层只保留一个抽屉/面板边界，配件项用分隔线和留白组织；展开内容直接挂在当前行下方。</text>

  <!-- PC mock -->
