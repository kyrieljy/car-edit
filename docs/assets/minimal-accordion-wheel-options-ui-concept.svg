  <rect x="56" y="128" width="816" height="300" rx="30" class="aura"/>
  <text class="text h2" x="94" y="184">PC 配置：列表行 + 分隔线</text>
  <text class="text small muted" x="94" y="210">轮毂选项本身已有框体，外层 accordion 不再给每个配件 item 套卡片。</text>

